# Publica a pasta web/ (o painel) no GitHub Pages.
# Este arquivo fica na main para o botão "Run workflow" aparecer em Actions.
# Por padrão publica o painel do ramo bases-contexto; no botão dá para escolher outro ramo.
# Requer, uma vez: Settings → Pages → Source = "GitHub Actions".
name: Publicar painel no GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ramo:
        description: "Ramo cujo painel (pasta web/) será publicado"
        required: true
        default: bases-contexto
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ramo || 'bases-contexto' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: publicacao
        uses: actions/deploy-pages@v4
