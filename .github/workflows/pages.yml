# Publica a pasta web/ (o painel) no GitHub Pages.
# Roda a cada push que mude web/ em main ou bases-contexto, ou manualmente (Actions → "Publicar painel" → Run workflow).
# Requer, uma vez: Settings → Pages → Source = "GitHub Actions"; e, para publicar a partir de bases-contexto,
# Settings → Environments → github-pages → Deployment branches: incluir bases-contexto.
name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main, bases-contexto]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: publicacao
        uses: actions/deploy-pages@v4
